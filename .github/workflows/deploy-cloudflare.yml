name: Deploy to Cloudflare

on:
  push:
    branches:
      - cloudflare-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hot-deal-kr-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Deploy private Worker
        run: npx wrangler deploy --config cloudflare/worker.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pages frontend
        run: npx wrangler pages deploy dist --project-name hot-deal-kr --branch cloudflare-pages --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
